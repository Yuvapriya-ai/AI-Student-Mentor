<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Student Mentor | Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
</head>

<body>

<div class="register-page">

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <!-- BRAND -->

    <a href="/welcome" class="brand">

        <div class="brand-icon">
            ✦
        </div>

        <div class="brand-text">
            <h2>AI Student</h2>
            <span>MENTOR</span>
        </div>

    </a>


    <!-- REGISTER CARD -->

    <main class="register-container">

        <div class="register-card">

            <div class="card-header">

                <div class="header-icon">
                    ✦
                </div>

                <span class="eyebrow">
                    GET STARTED
                </span>

                <h1>
                    Create Your Account
                </h1>

                <p>
                    Start your personalized academic journey
                    with AI Student Mentor.
                </p>

            </div>


            <!-- REGISTER FORM -->

            <form class="register-form" id="registerForm">

                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ♙
                        </span>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required>

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ✉
                        </span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ●
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('password', this)">
                            Show
                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ●
                        </span>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('confirm-password', this)">
                            Show
                        </button>

                    </div>

                </div>


                <!-- TERMS -->

                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required>

                    <span>
                        I agree to use AI Student Mentor
                        for my academic learning and project assistance.
                    </span>

                </label>


                <!-- MESSAGE -->

                <div id="registerMessage"></div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="register-btn">

                    Create Account

                    <span>→</span>

                </button>

            </form>


            <!-- LOGIN -->

            <div class="login-section">

                <span>
                    Already have an account?
                </span>

                <a href="/login">
                    Login
                </a>

            </div>

        </div>


        <!-- BACK LINK -->

        <a href="/welcome" class="back-link">
            ← Back to Welcome
        </a>

    </main>


    <!-- FOOTER -->

    <footer>

        <span>
            ✦ AI Student Mentor
        </span>

        <p>
            Your intelligent academic companion.
        </p>

    </footer>

</div>


<script>

function togglePassword(inputId, button) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {

        input.type = "text";
        button.textContent = "Hide";

    } else {

        input.type = "password";
        button.textContent = "Show";

    }

}


document.getElementById("registerForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm-password").value;
    const message = document.getElementById("registerMessage");

    if (password !== confirmPassword) {

        message.textContent = "Passwords do not match.";
        message.style.color = "#f87171";

        return;
    }

    try {

        const response = await fetch("/register", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: name,
                email: email,
                password: password
            })

        });

        const result = await response.json();

        if (result.success) {

            message.textContent = "Account created successfully! Redirecting to login...";
            message.style.color = "#60a5fa";

            setTimeout(function() {
                window.location.href = "/login";
            }, 1200);

        } else {

            message.textContent = result.message;
            message.style.color = "#f87171";

        }

    } catch (error) {

        message.textContent = "Unable to create account. Please try again.";
        message.style.color = "#f87171";

        console.error(error);

    }

});

</script>

</body>
</html>
